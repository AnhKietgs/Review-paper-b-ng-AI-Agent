[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-paper-review"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9,<1",
  "markitdown[pdf,docx]>=0.1.2,<1",
  "pymupdf>=1.24,<3",
  "python-docx>=1.1,<2",
  "langgraph>=0.2,<2",
  "groq>=0.11,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pylint>=3,<5", "pycodestyle>=2.12,<3", "reportlab>=4,<6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pylint.main]
ignore-paths = ["^tests/"]

[tool.pylint.format]
max-line-length = 88

[tool.pycodestyle]
max-line-length = 88

