services:
  backend:
    build: ./backend
    environment:
      DATA_DIR: /app/data
      DEMO_LLM_MODE: ${DEMO_LLM_MODE:-fixture}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_SUPERVISOR_MODEL: ${GROQ_SUPERVISOR_MODEL:-openai/gpt-oss-20b}
      GROQ_SCIENTIFIC_REVIEW_MODEL: ${GROQ_SCIENTIFIC_REVIEW_MODEL:-openai/gpt-oss-120b}
      GROQ_RELATED_WORK_MODEL: ${GROQ_RELATED_WORK_MODEL:-openai/gpt-oss-20b}
      GROQ_EVIDENCE_VERIFIER_MODEL: ${GROQ_EVIDENCE_VERIFIER_MODEL:-openai/gpt-oss-20b}
      GROQ_RATE_LIMIT_WAIT_SECONDS: ${GROQ_RATE_LIMIT_WAIT_SECONDS:-60}
    volumes:
      - app_data:/app/data
      - ./demo_data:/app/demo_data:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
volumes:
  app_data:

